name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Articles Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY is not set."
            exit 1
          fi
          
          echo "Pinging Supabase to prevent project pause..."
          
          # Send a GET request to the articles table fetching just 1 row
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/articles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            
          if [ "$response" -eq 200 ] || [ "$response" -eq 206 ]; then
            echo "Successfully pinged Supabase (Status: $response)"
          else
            echo "Failed to ping Supabase (Status: $response)"
            exit 1
          fi
