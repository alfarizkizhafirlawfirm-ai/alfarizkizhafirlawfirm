name: Supabase Backup

on:
  schedule:
    # Runs once a week on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup Supabase Articles Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY is not set."
            exit 1
          fi
          
          echo "Fetching articles data..."
          
          # Send a GET request to the articles table fetching all rows
          curl -s -X GET "${SUPABASE_URL}/rest/v1/articles?select=*" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > articles_backup.json
            
          if [ ! -s articles_backup.json ]; then
            echo "Error: Backup file is empty or failed to download."
            exit 1
          fi
          
          echo "Backup successful."

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-articles-backup
          path: articles_backup.json
          retention-days: 30
